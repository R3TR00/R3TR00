<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Huzayfah Nasef (R3TR00) — AI / Machine Learning &amp; Backend Engineer">
  <defs>
    <!-- Deep terminal obsidian gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1017"/>
      <stop offset="55%" stop-color="#0d141f"/>
      <stop offset="100%" stop-color="#091118"/>
    </linearGradient>

    <!-- Subtle top cyber glow bar -->
    <linearGradient id="topAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e599" stop-opacity="0.9"/>
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#00e599" stop-opacity="0"/>
    </linearGradient>

    <!-- Ambient glow behind neural visual -->
    <radialGradient id="neuralGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00e599" stop-opacity="0.14"/>
      <stop offset="60%" stop-color="#38bdf8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#0b1017" stop-opacity="0"/>
    </radialGradient>

    <!-- Hero text gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#a5f3fc"/>
    </linearGradient>

    <!-- Subtle CRT scanlines -->
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#ffffff" fill-opacity="0.022"/>
    </pattern>

    <!-- Subtle dot grid -->
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#38bdf8" fill-opacity="0.09"/>
    </pattern>

    <!-- Rounded window clip -->
    <clipPath id="windowClip">
      <rect x="1" y="1" width="898" height="258" rx="12"/>
    </clipPath>
  </defs>

  <g clip-path="url(#windowClip)">
    <!-- Base background + grid + scanlines -->
    <rect x="0" y="0" width="900" height="260" fill="url(#bgGrad)"/>
    <rect x="0" y="38" width="900" height="222" fill="url(#dotGrid)"/>
    <ellipse cx="742" cy="128" rx="160" ry="95" fill="url(#neuralGlow)"/>

    <!-- Window chrome header -->
    <rect x="0" y="0" width="900" height="38" fill="#101822"/>
    <rect x="0" y="0" width="900" height="2" fill="url(#topAccent)"/>
    <line x1="0" y1="38" x2="900" y2="38" stroke="#1e2d3d" stroke-width="1"/>

    <!-- Window control dots -->
    <circle cx="24" cy="19" r="5" fill="#ff5f56" fill-opacity="0.85"/>
    <circle cx="42" cy="19" r="5" fill="#ffbd2e" fill-opacity="0.85"/>
    <circle cx="60" cy="19" r="5" fill="#27c93f" fill-opacity="0.85"/>

    <!-- Centered terminal title -->
    <text x="450" y="23" text-anchor="middle" fill="#7d8590" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace" font-size="12" letter-spacing="0.4">r3tr00@neural-node: ~/profile — zsh</text>

    <!-- Online status badge -->
    <rect x="790" y="9" width="86" height="20" rx="4" fill="#071f18" stroke="#00e599" stroke-opacity="0.35" stroke-width="1"/>
    <circle cx="804" cy="19" r="3.5" fill="#00e599">
      <animate attributeName="opacity" values="1;0.35;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <text x="815" y="22.5" fill="#00e599" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="10.5" font-weight="600" letter-spacing="1.2">ONLINE</text>

    <!-- LEFT CONTENT AREA -->
    <!-- Command prompt -->
    <text x="36" y="74" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="13">
      <tspan fill="#00e599" font-weight="700">❯</tspan>
      <tspan fill="#8b949e"> ./whoami.sh </tspan>
      <tspan fill="#38bdf8">--handle</tspan>
      <tspan fill="#f59e0b"> R3TR00</tspan>
    </text>

    <!-- Hero Name -->
    <text x="36" y="124" fill="url(#titleGrad)" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="36" font-weight="800" letter-spacing="2">HUZAYFAH NASEF</text>

    <!-- Role subtitle -->
    <text x="36" y="156" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="14.5" font-weight="600">
      <tspan fill="#00e599">AI / Machine Learning</tspan>
      <tspan fill="#485666">  //  </tspan>
      <tspan fill="#38bdf8">Python &amp; Backend Engineering</tspan>
    </text>

    <!-- Credentials line -->
    <text x="36" y="185" fill="#8b949e" font-family="'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, monospace" font-size="12.2">
      <tspan fill="#485666">[edu]</tspan>
      <tspan fill="#94a3b8"> Computer Science @ BFCAI  •  ML &amp; DL @ Samsung Innovation Campus</tspan>
    </text>

    <!-- RIGHT GRAPHIC: RETRO NEURAL-NET & TELEMETRY PANEL -->
    <g transform="translate(612, 54)">
      <rect x="0" y="0" width="256" height="146" rx="8" fill="#070c12" fill-opacity="0.88" stroke="#1e2d3d" stroke-width="1"/>
      <!-- Panel header -->
      <line x1="0" y1="24" x2="256" y2="24" stroke="#162230" stroke-width="1"/>
      <text x="12" y="15.5" fill="#38bdf8" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="9.5" letter-spacing="1">NEURAL.SYS</text>
      <text x="244" y="15.5" text-anchor="end" fill="#485666" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="9">0xR3TR00</text>

      <!-- Neural network edges (Layer 1 -> Layer 2) -->
      <g stroke="#1e3a4c" stroke-width="1" stroke-opacity="0.85">
        <line x1="42" y1="48" x2="128" y2="40"/>
        <line x1="42" y1="48" x2="128" y2="62"/>
        <line x1="42" y1="48" x2="128" y2="84"/>
        <line x1="42" y1="48" x2="128" y2="106"/>

        <line x1="42" y1="74" x2="128" y2="40"/>
        <line x1="42" y1="74" x2="128" y2="62"/>
        <line x1="42" y1="74" x2="128" y2="84"/>
        <line x1="42" y1="74" x2="128" y2="106"/>

        <line x1="42" y1="100" x2="128" y2="40"/>
        <line x1="42" y1="100" x2="128" y2="62"/>
        <line x1="42" y1="100" x2="128" y2="84"/>
        <line x1="42" y1="100" x2="128" y2="106"/>
      </g>

      <!-- Neural network edges (Layer 2 -> Layer 3) -->
      <g stroke="#1e3a4c" stroke-width="1" stroke-opacity="0.85">
        <line x1="128" y1="40" x2="214" y2="58"/>
        <line x1="128" y1="40" x2="214" y2="88"/>
        <line x1="128" y1="62" x2="214" y2="58"/>
        <line x1="128" y1="62" x2="214" y2="88"/>
        <line x1="128" y1="84" x2="214" y2="58"/>
        <line x1="128" y1="84" x2="214" y2="88"/>
        <line x1="128" y1="106" x2="214" y2="58"/>
        <line x1="128" y1="106" x2="214" y2="88"/>
      </g>

      <!-- Active highlighted pathways -->
      <path d="M42 74 L128 62 L214 58" fill="none" stroke="#00e599" stroke-width="1.6" stroke-opacity="0.85">
        <animate attributeName="stroke-opacity" values="0.25;0.95;0.25" dur="2.8s" repeatCount="indefinite"/>
      </path>
      <path d="M42 48 L128 84 L214 88" fill="none" stroke="#38bdf8" stroke-width="1.4" stroke-opacity="0.75">
        <animate attributeName="stroke-opacity" values="0.85;0.2;0.85" dur="3.4s" repeatCount="indefinite"/>
      </path>

      <!-- Input Layer Nodes -->
      <circle cx="42" cy="48" r="4.5" fill="#0b1017" stroke="#38bdf8" stroke-width="1.6"/>
      <circle cx="42" cy="74" r="4.5" fill="#00e599" stroke="#00e599" stroke-width="1.6"/>
      <circle cx="42" cy="100" r="4.5" fill="#0b1017" stroke="#38bdf8" stroke-width="1.6"/>

      <!-- Hidden Layer Nodes -->
      <circle cx="128" cy="40" r="4.5" fill="#0b1017" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="128" cy="62" r="4.8" fill="#00e599" stroke="#00e599" stroke-width="1.5"/>
      <circle cx="128" cy="84" r="4.5" fill="#38bdf8" stroke="#38bdf8" stroke-width="1.5"/>
      <circle cx="128" cy="106" r="4.5" fill="#0b1017" stroke="#38bdf8" stroke-width="1.5"/>

      <!-- Output Layer Nodes -->
      <circle cx="214" cy="58" r="5" fill="#00e599" stroke="#00e599" stroke-width="1.6"/>
      <circle cx="214" cy="88" r="5" fill="#0b1017" stroke="#38bdf8" stroke-width="1.6"/>

      <!-- Telemetry bottom bar inside panel -->
      <line x1="0" y1="120" x2="256" y2="120" stroke="#162230" stroke-width="1"/>
      <text x="12" y="136" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="9.5">
        <tspan fill="#64748b">core:</tspan>
        <tspan fill="#00e599"> py3.12</tspan>
        <tspan fill="#334155"> | </tspan>
        <tspan fill="#64748b">runtime:</tspan>
        <tspan fill="#38bdf8"> .NET</tspan>
      </text>
      <!-- Mini signal bars -->
      <rect x="220" y="131" width="3" height="6" rx="1" fill="#00e599" fill-opacity="0.45"/>
      <rect x="226" y="129" width="3" height="8" rx="1" fill="#00e599" fill-opacity="0.65"/>
      <rect x="232" y="127" width="3" height="10" rx="1" fill="#00e599" fill-opacity="0.85"/>
      <rect x="238" y="125" width="3" height="12" rx="1" fill="#00e599"/>
    </g>

    <!-- Bottom Status Bar -->
    <rect x="0" y="216" width="900" height="44" fill="#090e14"/>
    <line x1="0" y1="216" x2="900" y2="216" stroke="#1b2836" stroke-width="1"/>
    <text x="36" y="242" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11.5">
      <tspan fill="#00e599">▸</tspan>
      <tspan fill="#64748b"> CORE STACK: </tspan>
      <tspan fill="#cbd5e1">Python · TensorFlow · Pandas · C# · .NET · SQL · Angular</tspan>
    </text>

    <!-- Right footer identifier + blinking cursor -->
    <text x="852" y="242" text-anchor="end" font-family="'JetBrains Mono', 'SFMono-Regular', Consolas, monospace" font-size="11.5" fill="#38bdf8" letter-spacing="0.8">R3TR00 // AI·BE</text>
    <rect x="858" y="232" width="7" height="12" fill="#00e599">
      <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.49;0.5;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>

    <!-- Subtle CRT scanlines overlay -->
    <rect x="0" y="0" width="900" height="260" fill="url(#scanlines)"/>
  </g>

  <!-- Crisp outer border -->
  <rect x="1" y="1" width="898" height="258" rx="12" fill="none" stroke="#1e2d3d" stroke-width="1.5"/>
</svg>
